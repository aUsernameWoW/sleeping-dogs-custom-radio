# Dependabot for the libraries in reference\ that the build compiles against (Dependabot only knows package
# ecosystems; these are plain Git repositories). Monthly, for each library pinned in .github/reference.env,
# it looks for a newer release tag, or for a library without releases a newer commit that changes the files
# the build uses, and once that is a week old opens a PR moving the pin. build.yml then builds and tests
# against it; the modding workspace's own reference\ checkout should follow after the merge.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# PRs opened with the workflow token start no pull_request runs, so it dispatches build.yml on the branch;
# that run shows on the PR. Closing a PR without merging skips that version for good: its branch stays and is
# not proposed again until the branch is deleted. A PR for a newer version closes the library's older one.
name: Reference update

on:
  schedule:
    - cron: '43 4 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  list:
    name: List the pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - name: Check out .github/reference.env
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/reference.env
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Every <NAME>_REPO line is a library.
      - name: List the pins
        id: list
        run: echo "names=[$(sed -n 's/^\([A-Z0-9_]*\)_REPO=.*/"\1"/p' .github/reference.env | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  update:
    name: ${{ matrix.name }}
    needs: list
    if: needs.list.outputs.names != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NAME: ${{ matrix.name }}
      PIN: .github/reference.env
      COOLDOWN_DAYS: 7
    steps:
      # Credentials stay: the job pushes the update branch.
      - name: Check out SDRadio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open a PR for a newer version
        run: |
          . "$PIN"
          repo_var=${NAME}_REPO ref_var=${NAME}_REF tag_var=${NAME}_TAG files_var=${NAME}_FILES
          repo=${!repo_var} ref=${!ref_var} tag=${!tag_var} files=${!files_var}
          dir=${NAME,,}
          changes=
          if [ -n "$tag" ]; then
            # The highest plain version tag (v1.2.3; betas and other names are ignored).
            latest=$(git ls-remote --tags --refs "https://github.com/$repo" | sed -n 's|.*refs/tags/||p' |
              { grep -E '^v?[0-9]+(\.[0-9]+)*$' || true; } | sort -V | tail -n 1)
            if [ -z "$latest" ] || [ "$(printf '%s\n' "$tag" "$latest" | sort -V | tail -n 1)" = "$tag" ]; then
              echo "::notice::$repo: up to date ($tag)"
              exit 0
            fi
            # An annotated tag has its own date; a lightweight one is dated by its commit.
            read -r type sha < <(gh api "repos/$repo/git/ref/tags/$latest" --jq '"\(.object.type) \(.object.sha)"')
            if [ "$type" = tag ]; then
              read -r new date < <(gh api "repos/$repo/git/tags/$sha" --jq '"\(.object.sha) \(.tagger.date)"')
            else
              new=$sha
              date=$(gh api "repos/$repo/commits/$new" --jq .commit.committer.date)
            fi
            from=$tag to=$latest
          else
            # The newest default-branch commit that has had its week, if it changes a file the build uses.
            until=$(date -u -d "$COOLDOWN_DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            read -r new date < <(gh api "repos/$repo/commits?until=$until&per_page=1" --jq '.[0] | "\(.sha) \(.commit.committer.date)"')
            gh api "repos/$repo/compare/$ref...$new" --jq '.status, .files[]?.filename' > compare.txt
            changed=$(tail -n +2 compare.txt | grep -Fx -f <(tr ',' '\n' <<< "$files") | paste -sd, - || true)
            case $(head -n 1 compare.txt) in ahead | diverged) ;; *) changed= ;; esac
            if [ -z "$changed" ]; then
              echo "::notice::$repo: up to date (${ref:0:7}; $files unchanged up to ${new:0:7})"
              exit 0
            fi
            # Single-file libraries name their version near the top ("dr_wav - v0.14.6").
            version() {
              gh api -H 'Accept: application/vnd.github.raw+json' "repos/$repo/contents/$2?ref=$1" |
                awk 'NR <= 30 && !v && match($0, /v[0-9]+\.[0-9]+(\.[0-9]+)?/) { v = substr($0, RSTART, RLENGTH) } END { print v ? v : "?" }'
            }
            for f in ${changed//,/ }; do
              old_version=$(version "$ref" "$f")
              new_version=$(version "$new" "$f")
              if [ "$old_version" = "$new_version" ]; then
                changes+="- \`$f\` (still $new_version)"$'\n'
              else
                changes+="- \`$f\`: $old_version → $new_version"$'\n'
              fi
            done
            from=$ref to=$new
          fi
          label=${latest:-${new:0:7}}
          age=$(( ($(date +%s) - $(date -d "$date" +%s)) / 86400 ))
          if [ "$age" -lt "$COOLDOWN_DAYS" ]; then
            echo "::notice::$repo $label is $age days old; proposing it after $COOLDOWN_DAYS"
            exit 0
          fi
          branch="reference/$dir/$label"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists (open PR, or a closed one that skipped $label)"
            exit 0
          fi

          sed -i "s|^${NAME}_REF=.*|${NAME}_REF=$new|" "$PIN"
          if [ -n "$tag" ]; then sed -i "s|^${NAME}_TAG=.*|${NAME}_TAG=$latest|" "$PIN"; fi
          title="Move reference\\$dir to $label"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "$title" "$PIN"
          git push -q origin "$branch"

          # The comment above the library's lines in the pin file says what to watch out for.
          note=$(awk -v key="${NAME}_REPO=" '/^#/ { c = c substr($0, 3) "\n"; next } index($0, key) == 1 { printf "%s", c; exit } { c = "" }' "$PIN")
          {
            echo "Moves \`reference\\$dir\` ([$repo](https://github.com/$repo)) from ${tag:-${ref:0:7}} to $label: https://github.com/$repo/compare/$from...$to"
            if [ -n "$changes" ]; then
              echo
              echo "Files the build uses that changed:"
              printf '%s' "$changes"
            fi
            if [ -n "$note" ]; then
              echo
              sed 's/^/> /' <<< "$note"
            fi
            echo
            echo "The Build run on this branch builds and tests against it. After merging, move the modding workspace's \`reference\\$dir\` to the same commit (\`git fetch --tags\`, \`git checkout $new\`, \`git submodule update\`); versions named in THIRD-PARTY-NOTICES.md and the docs may need the same bump. Closing without merging skips $label."
          } > body.md
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "$title" --body-file body.md)
          gh workflow run build.yml --ref "$branch"

          for n in $(gh pr list --state open --json number,headRefName \
            --jq ".[] | select((.headRefName | startswith(\"reference/$dir/\")) and .headRefName != \"$branch\") | .number"); do
            gh pr close "$n" --comment "Superseded by $url." --delete-branch
          done
