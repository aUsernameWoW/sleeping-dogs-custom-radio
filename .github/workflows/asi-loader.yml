# Dependabot for the Ultimate ASI Loader that SDRadio.zip ships (Dependabot only knows package ecosystems,
# not GitHub release downloads). Monthly, it looks up the loader's latest release and, once that is a week
# old, opens a PR moving the pin in .github/asi-loader.env. The mod only relies on the loader loading
# plugins\*.asi, so following its releases is low-risk; the PR still lets a person look before players get it.
#
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# PRs opened with the workflow token start no pull_request runs, so it dispatches build.yml on the branch;
# that run (incl. the Package job, which downloads and checks the new loader) shows on the PR.
# Closing a PR without merging skips that version for good: its branch stays and is not proposed again
# until the branch is deleted.
name: ASI loader update

on:
  schedule:
    - cron: '23 4 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: Check for a new release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LOADER_REPO: ThirteenAG/Ultimate-ASI-Loader
      ASSET: Ultimate-ASI-Loader-NoPDB_x64.zip
      PIN: .github/asi-loader.env
      COOLDOWN_DAYS: 7
    steps:
      # Credentials stay: the job pushes the update branch.
      - name: Check out SDRadio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open a PR for a newer loader
        run: |
          . "$PIN"
          gh api "repos/$LOADER_REPO/releases/latest" > release.json
          tag=$(jq -r .tag_name release.json)
          url=$(jq -r --arg a "$ASSET" '.assets[] | select(.name == $a) | .browser_download_url' release.json)
          digest=$(jq -r --arg a "$ASSET" '.assets[] | select(.name == $a) | .digest // empty' release.json)
          if [ -z "$url" ]; then
            echo "::error::$LOADER_REPO $tag has no $ASSET"
            exit 1
          fi
          if [ "$url" = "$ASI_LOADER_URL" ]; then
            echo "::notice::Up to date ($tag)"
            exit 0
          fi
          age=$(( ($(date +%s) - $(date -d "$(jq -r .published_at release.json)" +%s)) / 86400 ))
          if [ "$age" -lt "$COOLDOWN_DAYS" ]; then
            echo "::notice::$tag is $age days old; proposing it after $COOLDOWN_DAYS"
            exit 0
          fi
          branch="asi-loader/$tag"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists (open PR, or a closed one that skipped $tag)"
            exit 0
          fi

          # Hash the file ourselves; GitHub's digest, when the release has one, must agree.
          curl -sSfL --retry 3 -o loader.zip "$url"
          sha=$(sha256sum loader.zip | cut -d' ' -f1)
          if [ -n "$digest" ] && [ "$digest" != "sha256:$sha" ]; then
            echo "::error::$ASSET hashes to $sha, the release says $digest"
            exit 1
          fi
          unzip -l loader.zip
          unzip -l loader.zip '*dinput8.dll' > /dev/null || { echo "::error::$ASSET has no dinput8.dll"; exit 1; }

          sed -i -e "s|^ASI_LOADER_URL=.*|ASI_LOADER_URL=$url|" -e "s|^ASI_LOADER_SHA256=.*|ASI_LOADER_SHA256=$sha|" "$PIN"
          git switch -c "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Bundle Ultimate ASI Loader $tag" "$PIN"
          git push -q origin "$branch"

          old=$(sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p' <<< "$ASI_LOADER_URL")
          {
            echo "Moves the Ultimate ASI Loader shipped as \`dinput8.dll\` in \`SDRadio.zip\` from $old to [$tag](https://github.com/$LOADER_REPO/releases/tag/$tag)."
            echo
            echo "- Asset: \`$ASSET\`, SHA-256 \`$sha\`"
            echo "- Changes: https://github.com/$LOADER_REPO/compare/$old...$tag"
            echo "- Licenses: check what the x64 \`dinput8.dll\` compiles in (\`premake5.lua\` at $tag; at v9.7.4 MinHook, miniz and injector's FunctionHookMinHook) and update THIRD-PARTY-NOTICES.md, its version included, on this branch before merging."
            echo
            echo "The Build run on this branch downloads and checks it. Worth a quick start of the game with the new \`dinput8.dll\` before merging. Closing without merging skips $tag."
          } > body.md
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" --title "Bundle Ultimate ASI Loader $tag" --body-file body.md
          gh workflow run build.yml --ref "$branch"
